services:
  nginx:
    build: requirements/nginx/
    image: nginx
    container_name: nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress_volume:/var/www/wordpress
    networks:
     - inception
    restart: always

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    image: wordpress
    env_file:
      - ./.env
    depends_on:
      - mariadb
    volumes:
      - wordpress_volume:/var/www/wordpress
    networks:
     - inception
    restart: always

  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    image: mariadb
    env_file:
      - ./.env
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
     - inception
    restart: always

volumes:
  wordpress_volume:
    driver: local #tells Docker to use the standard storage driver built into Linux
    driver_opts:
      type: 'none' #don't try to format or manage the filesystem
      o: 'bind' #creates a direct portal from inside the container to a specific folder on your host machine
      device: '/home/mzouine/data/wordpress'
  mariadb_volume:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind' 
      device: '/home/mzouine/data/mariadb'
networks:
  inception:
    driver: bridge